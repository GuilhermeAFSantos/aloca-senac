spring.application.name=aloca-senac

# Esquema versionado pelo Flyway (ADR-003); o Hibernate só valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Servico de Notificacao externo (RF11; simulado, WireMock nos testes)
alocasenac.notificacao.url=http://localhost:9999
alocasenac.notificacao.agendamento=true
alocasenac.notificacao.intervalo-ms=30000

# Segredo HMAC dos tokens JWT da API (ADR-014). Nunca versionar o valor real:
# defina a variavel de ambiente ALOCASENAC_JWT_SEGREDO (minimo de 32 caracteres).
alocasenac.jwt.segredo=${ALOCASENAC_JWT_SEGREDO:}
