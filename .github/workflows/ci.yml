# Integração contínua do AlocaSenac (RQ-5; LIM-2).
# Mesmo comando usado localmente: ./mvnw -B verify (inclui os testes com Testcontainers).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Histórico completo: o SonarCloud usa o blame para separar o código novo
          fetch-depth: 0

      - name: Java 21 (Temurin) com cache Maven
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # O verify inclui o gate do JaCoCo (MT-1: 80% de linhas; MT-2: 70% de branches)
      - name: Build, testes e gate de cobertura
        run: ./mvnw -B verify

      # Análise estática com a cobertura do JaCoCo. O Quality Gate do código novo barra o check (qualitygate.wait).
      - name: Análise do SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_ALCOA_SENAC }}
        run: >-
          ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:5.1.0.4751:sonar
          -Dsonar.qualitygate.wait=true

      - name: Relatórios do Surefire e do Failsafe
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: relatorios-de-teste
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: warn
          retention-days: 7

      - name: Relatório de cobertura do JaCoCo
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: relatorio-jacoco
          path: target/site/jacoco/
          if-no-files-found: warn
          retention-days: 7
